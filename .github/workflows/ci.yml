name: CI

# 每次推送与 PR 都跑：静态检查 / 单测 / 内容校验 / 构建 + 体积 / 端到端。
# 双语版面巡检**不在这里跑** —— 它是"把每个画面截下来人眼扫一遍"的 50–60 分钟巡检，
# 已移到 .github/workflows/audit.yml（每周一次 + 手动触发）。
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# 只读就够：CI 不写仓库（发版在工作流在 release.yml 里单独授权）
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '24'

jobs:
  # ---------- 静态检查与单测 ----------
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: 类型检查
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint
      - name: 单元测试
        run: pnpm test
      - name: 内容校验（含中英译文与关卡脚本）
        run: pnpm content:check
      - name: 构建
        run: pnpm build
      # 体积是硬指标：以前这一步只在本地 pnpm verify 里跑，CI 上从来没有真的守过
      - name: 体积守卫
        run: pnpm size

  # ---------- 端到端：真实浏览器里把每个典故玩一遍 ----------
  e2e:
    runs-on: ubuntu-latest
    # 不给上限的话卡死会挂满默认 6 小时
    # 端到端 ~94 条串行：本机 20–25 分钟，CI 上约 35–45 分钟；给足余量
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # 浏览器下载 ~40–60s/job：按 lock 文件的哈希缓存，lock 没动就不再下第二遍
      - name: 缓存 Playwright 浏览器
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: 安装浏览器
        run: pnpm exec playwright install --with-deps chromium

      - name: 开发服务器端到端
        run: pnpm e2e

      # 前一步挂了也要跑：产物拆分与懒加载是另一条链路，不该被开发服务器的失败吞掉
      - name: 生产构建产物端到端
        if: '!cancelled()'
        run: pnpm e2e:dist

      # 失败时留下截图与轨迹（配置了 only-on-failure / retain-on-failure）。
      # 之前传的是 playwright-report，但 reporter 是 list、根本没这个目录。
      - name: 失败时保留截图与轨迹
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: test-results
          retention-days: 7
          if-no-files-found: ignore
