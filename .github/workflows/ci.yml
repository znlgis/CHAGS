name: CI

# 每次推送与 PR 都跑。
# 之前的 release.yml 只在打 tag 时跑，而且**不包括端到端** ——
# 也就是说玩法被改坏了也要等到发版那一刻才会发现。
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# 只读就够：CI 不写仓库（发版在工作流在 release.yml 里单独授权）
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '24'

jobs:
  # ---------- 静态检查与单测 ----------
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: 类型检查
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint
      - name: 单元测试
        run: pnpm test
      - name: 内容校验（含中英译文与关卡脚本）
        run: pnpm content:check
      - name: 构建
        run: pnpm build
      # 体积是硬指标：以前这一步只在本地 pnpm verify 里跑，CI 上从来没有真的守过
      - name: 体积守卫
        run: pnpm size

  # ---------- 端到端：真实浏览器里把每个典故玩一遍 ----------
  e2e:
    runs-on: ubuntu-latest
    # 不给上限的话卡死会挂满默认 6 小时
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: 安装浏览器
        run: pnpm exec playwright install --with-deps chromium

      - name: 开发服务器端到端
        run: pnpm e2e

      # 前一步挂了也要跑：产物拆分与懒加载是另一条链路，不该被开发服务器的失败吞掉
      - name: 生产构建产物端到端
        if: '!cancelled()'
        run: pnpm e2e:dist

      # 失败时留下截图与轨迹（配置了 only-on-failure / retain-on-failure）。
      # 之前传的是 playwright-report，但 reporter 是 list、根本没这个目录。
      - name: 失败时保留截图与轨迹
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: test-results
          retention-days: 7
          if-no-files-found: ignore

  # ---------- 双语版面巡检：把每个画面截下来，人工扫一眼 ----------
  audit:
    # PR 上跑太慢（17 部 × 2 语言，约 30 分钟），只在主干与手动触发时跑
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    # 巡检本身约 50–60 分钟（两个语言 × 18 个用例）；上限给足余量，
    # 因为被 job 级掐断时连 if: always() 的截图都传不上来，而"挂在哪一屏"正是巡检要回答的
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium

      - name: 中英双语版面巡检
        run: pnpm audit:i18n

      # 失败时更要看：卡在哪一屏，截图里就是。之前没写 if: always()，
      # 一挂就什么都拿不到 —— 而"挂在哪"恰恰是巡检最需要回答的
      - name: 上传巡检截图（人工过目）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: i18n-audit
          path: .scratch/i18n-audit
          retention-days: 14
