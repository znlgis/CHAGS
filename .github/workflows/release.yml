name: Release

# 打 tag 即发布：构建 Windows 便携 exe 与安卓 apk，挂到 GitHub Release
on:
  push:
    tags:
      - 'v*'
  # 手动跑一次只出产物、不发 Release（用于验证流程）
  workflow_dispatch:
    inputs:
      require_signed_apk:
        description: '没有签名 Secrets 就直接失败（默认：用 debug 密钥签一个能直接装到手机上的 APK）'
        type: boolean
        default: false

# 默认只读：只有最后发 Release 的那个 job 需要写权限
permissions:
  contents: read

# 同一条 tag 的发布不并发：产物是一样的，两个 job 抢着发只会互相覆盖
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: '24'
  # 产物体积门禁（字节）：exe/apk 历史实测 3.3–3.6MB；超过这里说明误打进了调试符号、
  # 多架构产物或未压缩资源 —— 与其发一个几十 MB 的包，不如在收集步骤直接失败。
  ARTIFACT_MAX_BYTES: 6291456

jobs:
  # ---------- 解析版本号 ----------
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      code: ${{ steps.v.outputs.code }}
    steps:
      - id: v
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="0.0.0-dev"
          fi
          CORE="${VERSION%%-*}"
          IFS='.' read -r MAJOR MINOR PATCH <<< "$CORE"
          MAJOR=${MAJOR:-0}; MINOR=${MINOR:-0}; PATCH=${PATCH:-0}
          # tag 名不规范时归零，别让算术炸掉
          [[ "$MAJOR" =~ ^[0-9]+$ ]] || MAJOR=0
          [[ "$MINOR" =~ ^[0-9]+$ ]] || MINOR=0
          [[ "$PATCH" =~ ^[0-9]+$ ]] || PATCH=0
          CODE=$(( MAJOR * 10000 + MINOR * 100 + PATCH ))
          # 安卓要求 versionCode >= 1。手动触发（0.0.0-dev）与 v0.0.0 都会算出 0，
          # 直接构建会报 "versionCode is set to 0, but it should be a positive integer"。
          if [ "$CODE" -lt 1 ]; then CODE=1; fi
          {
            echo "version=$VERSION"
            echo "code=$CODE"
          } >> "$GITHUB_OUTPUT"
          echo "版本：$VERSION（versionCode $CODE）"

  # ---------- 站点产物 + 质量门禁（只构建一次，两个平台共用同一份） ----------
  web:
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: 质量门禁（类型 / lint / 单测 / 内容校验）
        run: |
          pnpm typecheck
          pnpm lint
          pnpm test
          pnpm content:check

      - name: 构建站点
        run: pnpm --filter @chags/site build

      # 体积守卫也进发版链路：以前只有本地 verify 守着，CI 与发版都没守过
      - name: 体积守卫
        run: pnpm size

      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: apps/site/dist
          retention-days: 1

  # ---------- 端到端门禁：玩法被改坏了不许发版 ----------
  # 与 web/windows/android 并行（只依赖版本号）。跑**真实指针操作**子集：
  # 用 test(..., { tag: '@real' }) 标出来的典故与三十六计用例，约 5–8 分钟。
  # autoplay / 双语载入 / 静态用例不进发版门禁 —— 它们证明不了"点得到、拖得上"。
  e2e:
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # 浏览器下载 ~40–60s/job：按 lock 文件的哈希缓存，lock 没动就不再下第二遍
      - name: 缓存 Playwright 浏览器
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: 安装浏览器
        run: pnpm exec playwright install --with-deps chromium

      # 真实操作子集：典故 19 条（17 部）+ 三十六计 5 条（覆盖 chain/siege/stillness/swap/lure 五个场景）
      - name: 真实操作端到端（发版门禁）
        run: pnpm exec playwright test --grep "@real"

      # 生产产物链路：首屏懒加载 + 重 chunk 归属。前一步挂了也要跑 ——
      # 开发服务器挂了不代表产物链路坏了，反之亦然。
      # 构建在 e2e:dist 里做（preview 配置的 webServer 只起 vite preview，不重复 build）
      - name: 生产构建产物端到端
        if: '!cancelled()'
        run: pnpm e2e:dist

      # 失败时留下截图与轨迹（配置了 only-on-failure / retain-on-failure）
      - name: 失败时保留截图与轨迹
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: release-playwright-results
          path: test-results
          retention-days: 7
          if-no-files-found: ignore

  # ---------- Windows 便携 exe ----------
  windows:
    needs: [version, web]
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: apps/site/dist
      - name: 校验站点产物就位
        shell: pwsh
        run: |
          if (-not (Test-Path apps/site/dist/index.html)) { throw "站点产物没就位：apps/site/dist/index.html 不存在" }
          Get-ChildItem apps/site/dist -Recurse -File | Measure-Object | ForEach-Object { "站点文件数：$($_.Count)" }

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target

      - name: 注入版本号
        shell: pwsh
        run: |
          node -e "const fs=require('fs');const p='apps/desktop/src-tauri/tauri.conf.json';const c=JSON.parse(fs.readFileSync(p,'utf8'));c.version=process.argv[1];fs.writeFileSync(p,JSON.stringify(c,null,2));" "${{ needs.version.outputs.version }}"

      - name: 构建便携 exe
        working-directory: apps/desktop
        run: pnpm exec tauri build --no-bundle

      - name: 收集产物（含体积门禁）
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path out | Out-Null
          $exe = "out/CHAGS-${{ needs.version.outputs.version }}-windows-x64-portable.exe"
          Copy-Item apps/desktop/src-tauri/target/release/chags.exe $exe
          Get-ChildItem out | ForEach-Object { "{0:N2} MB  {1}" -f ($_.Length/1MB), $_.Name }
          # 体积门禁：历史实测 3.3–3.5MB。超限多半是误打了调试符号或整个资源目录
          $size = (Get-Item $exe).Length
          if ($size -gt [long]$env:ARTIFACT_MAX_BYTES) {
            throw ("exe 体积超标：{0:N2} MB > {1:N2} MB" -f ($size/1MB), ([long]$env:ARTIFACT_MAX_BYTES/1MB))
          }

      - uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: out/*.exe
          retention-days: 7

  # ---------- 安卓 apk ----------
  android:
    needs: [version, web]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      # release（正式密钥）/ debug（没配 Secrets 时的兜底，能装但不能覆盖正式版）
      signature: ${{ steps.sign.outputs.kind }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      # Gradle 8.14 不支持 JDK 25，必须用 17–21
      # v4 已停止维护，v5 是当前版本
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4

      # 刻意不用 android-actions/setup-android@v3：
      # 它内部会去装早已从 SDK 仓库移除的 'tools' 包，必然报
      # "Failed to find package 'tools'" 然后整个 job 挂掉。
      # ubuntu runner 本来就预装了 Android SDK，自己定位一下即可。
      - name: 定位 Android SDK
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          if [ ! -d "$SDK" ]; then
            echo "::error::runner 上找不到 Android SDK（试过 $SDK）"
            exit 1
          fi
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          # cmdline-tools 的目录名带版本号，别写死 latest
          for dir in "$SDK"/cmdline-tools/*/bin; do
            [ -d "$dir" ] && echo "$dir" >> "$GITHUB_PATH"
          done
          echo "SDK 路径：$SDK"
          ls "$SDK/cmdline-tools" || true

      - name: 安装 Android SDK 组件
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager --install "platform-tools" "platforms;android-36" "build-tools;36.0.0"
          echo "--- 已装平台 ---"
          ls "$ANDROID_SDK_ROOT/platforms"
          echo "--- 已装 build-tools ---"
          ls "$ANDROID_SDK_ROOT/build-tools"

      - run: pnpm install --frozen-lockfile

      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: apps/site/dist
      - name: 校验站点产物就位
        run: test -f apps/site/dist/index.html || { echo "站点产物没就位"; exit 1; }

      # 签名策略：**默认能装就行**。
      # 这个项目只做"自己手机装一个"，不上架应用商店，所以没有正式密钥时用 debug 密钥签
      # （apps/mobile/android/app/build.gradle 里 hasReleaseKeystore 为假时就是这条路），
      # 产物可以直接安装。代价写在 docs/打包与分发.md：debug 密钥每次构建可能都不一样，
      # 手机上装新版若报签名冲突，得先卸载旧版（卸载会清掉本地存档）。
      # 想要"以后能直接覆盖安装、存档不丢"，用 pnpm keystore 生成一次密钥并配成 Secrets，
      # 本步骤会自动改走正式签名；勾 require_signed_apk 则可以在没有 Secrets 时直接失败。
      - name: 写入签名材料
        id: sign
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cd apps/mobile/android
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > chags-release.keystore
            {
              echo "storeFile=chags-release.keystore"
              echo "storePassword=$STORE_PASSWORD"
              echo "keyAlias=$KEY_ALIAS"
              echo "keyPassword=$KEY_PASSWORD"
            } > keystore.properties
            echo "kind=release" >> "$GITHUB_OUTPUT"
            echo "已配置 Release 签名（正式密钥）"
          elif [ "${{ inputs.require_signed_apk }}" = "true" ]; then
            echo "::error::勾选了 require_signed_apk，但没有配置 ANDROID_KEYSTORE_* Secrets。"
            echo "::error::请先 pnpm keystore 生成密钥并配好 Secrets，或取消勾选。"
            exit 1
          else
            echo "kind=debug" >> "$GITHUB_OUTPUT"
            echo "::warning::没有配置签名 Secrets —— 本次用 debug 密钥签名。APK 可以直接装到手机上；但 debug 密钥可能每次构建都不同，装新版若报'签名不一致'，先卸载旧版再装（卸载会清掉本地存档）。想要能覆盖安装：pnpm keystore 生成密钥后配成 Secrets，详见 docs/打包与分发.md。"
          fi

      - name: 构建 APK
        working-directory: apps/mobile
        env:
          CHAGS_VERSION_NAME: ${{ needs.version.outputs.version }}
          CHAGS_VERSION_CODE: ${{ needs.version.outputs.code }}
        run: |
          pnpm exec cap sync android
          cd android
          # gradlew 是在 Windows 上提交的，git 没保留可执行位 ——
          # 直接 ./gradlew 会 exit 126（Permission denied）。
          # 仓库里已用 git update-index --chmod=+x 修正，这里再兜一层。
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: 校验签名
        run: |
          # pipefail：否则 apksigner 的失败退出码会被 head 吃掉（原来那版等于没校验）
          set -euo pipefail
          APK=apps/mobile/android/app/build/outputs/apk/release/app-release.apk
          APKSIGNER="$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner"
          # 显式判退出码：赋值语句里的失败不会自己中止脚本
          if ! CERTS="$("$APKSIGNER" verify --print-certs "$APK")"; then
            echo "::error::apksigner 校验失败：$APK"
            exit 1
          fi
          echo "$CERTS" | head -4
          # 签名者是不是 debug 证书，比"有没有签名"更要紧：debug 签名同样能通过 verify
          if echo "$CERTS" | grep -q 'CN=Android Debug'; then
            if [ "${{ steps.sign.outputs.kind }}" = "release" ]; then
              echo "::error::配了正式签名 Secrets，产出的却是 debug 签名 —— 检查 keystore.properties 与 build.gradle"
              exit 1
            fi
            echo "::notice::这是 debug 签名的 APK：可以直接装到手机上（不上架完全够用），但不要拿去分发；若与手机上已装版本的签名不同，需要先卸载旧版"
          else
            echo "::notice::已用正式密钥签名，可以直接覆盖安装旧版本"
          fi

      - name: 收集产物（含体积门禁）
        run: |
          set -euo pipefail
          mkdir -p out
          apk="out/CHAGS-${{ needs.version.outputs.version }}-android.apk"
          cp apps/mobile/android/app/build/outputs/apk/release/app-release.apk "$apk"
          ls -lh out
          # 体积门禁：历史实测 3.4–3.6MB。超限多半是把未压缩资源或全部 ABI 一起打进来了
          size=$(stat -c%s "$apk")
          echo "APK 体积：$((size / 1024 / 1024)) MB（上限 $((ARTIFACT_MAX_BYTES / 1024 / 1024)) MB）"
          if [ "$size" -gt "$ARTIFACT_MAX_BYTES" ]; then
            echo "::error::APK 体积超标：$((size / 1024 / 1024))MB > $((ARTIFACT_MAX_BYTES / 1024 / 1024))MB"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: out/*.apk
          retention-days: 7

  # ---------- 发 Release ----------
  release:
    # e2e 也在里面：玩法被改坏时，宁可这一次发布失败，也不要把一个有问题的版本挂出去
    needs: [version, web, windows, android, e2e]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # 写权限只给这一步：上面那些 job 会跑第三方 action，不需要写仓库
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: 整理发布文件
        run: |
          mkdir -p files
          cp artifacts/windows-exe/*.exe files/
          cp artifacts/android-apk/*.apk files/
          ls -lh files

      - uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          files: files/*
          generate_release_notes: true
          draft: false
          # 注意：不要在这里传 prerelease —— with 的输入全是字符串，
          # "false" 在 JS 里是 truthy，会把正式版本也标成预发布。
          # 预发布标记由下一步显式纠正。
          body: |
            ## 下载

            | 平台 | 文件 | 说明 |
            |---|---|---|
            | Windows | CHAGS-${{ needs.version.outputs.version }}-windows-x64-portable.exe | 便携版，**双击即玩，无需安装**（首次运行可能有 SmartScreen 提示，选「更多信息 → 仍要运行」） |
            | Android | CHAGS-${{ needs.version.outputs.version }}-android.apk | 直接安装（需在设置里允许「安装未知来源的应用」） |

            版本 ${{ needs.version.outputs.version }} ｜ 内置中英文，可在应用内一键切换。

            ${{ needs.android.outputs.signature == 'debug' && '⚠️ 本次 APK 用 **debug 密钥**签名（仓库没有配置签名 Secrets）：可以直接安装使用。若手机上已装过旧版且提示「签名不一致」，请先卸载旧版再装（卸载会清掉本地存档）。想要以后能直接覆盖安装、存档不丢：本地跑 pnpm keystore 生成密钥并配成 GitHub Secrets，见 docs/打包与分发.md。' || '✅ 本次 APK 用**正式密钥**签名，可以直接覆盖安装旧版本。' }}

      - name: 确认发布类型
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 这个 job 没有 checkout（只下载构建产物），而 gh 需要知道是哪个仓库 ——
          # 不给它就会去跑 git remote，然后报 "not a git repository"。
          GH_REPO: ${{ github.repository }}
        run: |
          # 带 - 的 tag（v1.0.0-beta.1）保持预发布；其余显式改回正式发布。
          # 不这么做的话，上面的 action 会因为"字符串 false 是 truthy"而一律标成预发布。
          if [[ "${GITHUB_REF_NAME}" == *-* ]]; then
            # 带 - 的 tag（v1.0.0-beta.1）：action 那边没传 prerelease（默认正式），这里补标
            gh release edit "${GITHUB_REF_NAME}" --prerelease
            echo "${GITHUB_REF_NAME} 已标为预发布"
          else
            gh release edit "${GITHUB_REF_NAME}" --prerelease=false
            echo "${GITHUB_REF_NAME} 已确认为正式发布"
          fi
