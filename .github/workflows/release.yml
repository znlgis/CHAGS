name: Release

# 打 tag 即发布：构建 Windows 便携 exe 与安卓 apk，挂到 GitHub Release
on:
  push:
    tags:
      - 'v*'
  # 手动跑一次只出产物、不发 Release（用于验证流程）
  workflow_dispatch:

permissions:
  contents: write

env:
  NODE_VERSION: '24'

jobs:
  # ---------- 解析版本号 ----------
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      code: ${{ steps.v.outputs.code }}
    steps:
      - id: v
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="0.0.0-dev"
          fi
          CORE="${VERSION%%-*}"
          IFS='.' read -r MAJOR MINOR PATCH <<< "$CORE"
          MAJOR=${MAJOR:-0}; MINOR=${MINOR:-0}; PATCH=${PATCH:-0}
          # tag 名不规范时归零，别让算术炸掉
          [[ "$MAJOR" =~ ^[0-9]+$ ]] || MAJOR=0
          [[ "$MINOR" =~ ^[0-9]+$ ]] || MINOR=0
          [[ "$PATCH" =~ ^[0-9]+$ ]] || PATCH=0
          CODE=$(( MAJOR * 10000 + MINOR * 100 + PATCH ))
          # 安卓要求 versionCode >= 1。手动触发（0.0.0-dev）与 v0.0.0 都会算出 0，
          # 直接构建会报 "versionCode is set to 0, but it should be a positive integer"。
          if [ "$CODE" -lt 1 ]; then CODE=1; fi
          {
            echo "version=$VERSION"
            echo "code=$CODE"
          } >> "$GITHUB_OUTPUT"
          echo "版本：$VERSION（versionCode $CODE）"

  # ---------- 站点产物 + 质量门禁（只构建一次，两个平台共用同一份） ----------
  web:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: 质量门禁（类型 / lint / 单测 / 内容校验）
        run: |
          pnpm typecheck
          pnpm lint
          pnpm test
          pnpm content:check

      - name: 构建站点
        run: pnpm --filter @chags/site build

      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: apps/site/dist
          retention-days: 1

  # ---------- Windows 便携 exe ----------
  windows:
    needs: [version, web]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: apps/site/dist
      - name: 校验站点产物就位
        shell: pwsh
        run: |
          if (-not (Test-Path apps/site/dist/index.html)) { throw "站点产物没就位：apps/site/dist/index.html 不存在" }
          Get-ChildItem apps/site/dist -Recurse -File | Measure-Object | ForEach-Object { "站点文件数：$($_.Count)" }

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target

      - name: 注入版本号
        shell: pwsh
        run: |
          node -e "const fs=require('fs');const p='apps/desktop/src-tauri/tauri.conf.json';const c=JSON.parse(fs.readFileSync(p,'utf8'));c.version=process.argv[1];fs.writeFileSync(p,JSON.stringify(c,null,2));" "${{ needs.version.outputs.version }}"

      - name: 构建便携 exe
        working-directory: apps/desktop
        run: pnpm exec tauri build --no-bundle

      - name: 收集产物
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path out | Out-Null
          Copy-Item apps/desktop/src-tauri/target/release/chags.exe "out/CHAGS-${{ needs.version.outputs.version }}-windows-x64-portable.exe"
          Get-ChildItem out | ForEach-Object { "{0:N2} MB  {1}" -f ($_.Length/1MB), $_.Name }

      - uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: out/*.exe
          retention-days: 7

  # ---------- 安卓 apk ----------
  android:
    needs: [version, web]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      # Gradle 8.14 不支持 JDK 25，必须用 17–21
      # v4 已停止维护，v5 是当前版本
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4

      # 刻意不用 android-actions/setup-android@v3：
      # 它内部会去装早已从 SDK 仓库移除的 'tools' 包，必然报
      # "Failed to find package 'tools'" 然后整个 job 挂掉。
      # ubuntu runner 本来就预装了 Android SDK，自己定位一下即可。
      - name: 定位 Android SDK
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          if [ ! -d "$SDK" ]; then
            echo "::error::runner 上找不到 Android SDK（试过 $SDK）"
            exit 1
          fi
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          # cmdline-tools 的目录名带版本号，别写死 latest
          for dir in "$SDK"/cmdline-tools/*/bin; do
            [ -d "$dir" ] && echo "$dir" >> "$GITHUB_PATH"
          done
          echo "SDK 路径：$SDK"
          ls "$SDK/cmdline-tools" || true

      - name: 安装 Android SDK 组件
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager --install "platform-tools" "platforms;android-36" "build-tools;36.0.0"
          echo "--- 已装平台 ---"
          ls "$ANDROID_SDK_ROOT/platforms"
          echo "--- 已装 build-tools ---"
          ls "$ANDROID_SDK_ROOT/build-tools"

      - run: pnpm install --frozen-lockfile

      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: apps/site/dist
      - name: 校验站点产物就位
        run: test -f apps/site/dist/index.html || { echo "站点产物没就位"; exit 1; }

      - name: 写入签名材料
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cd apps/mobile/android
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > chags-release.keystore
            {
              echo "storeFile=chags-release.keystore"
              echo "storePassword=$STORE_PASSWORD"
              echo "keyAlias=$KEY_ALIAS"
              echo "keyPassword=$KEY_PASSWORD"
            } > keystore.properties
            echo "已配置 Release 签名"
          else
            echo "::warning::未配置签名 Secrets（ANDROID_KEYSTORE_BASE64 等），本次将使用 debug 签名 —— 产物仍可安装，但不适合正式分发"
          fi

      - name: 构建 APK
        working-directory: apps/mobile
        env:
          CHAGS_VERSION_NAME: ${{ needs.version.outputs.version }}
          CHAGS_VERSION_CODE: ${{ needs.version.outputs.code }}
        run: |
          pnpm exec cap sync android
          cd android
          # gradlew 是在 Windows 上提交的，git 没保留可执行位 ——
          # 直接 ./gradlew 会 exit 126（Permission denied）。
          # 仓库里已用 git update-index --chmod=+x 修正，这里再兜一层。
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: 校验签名
        run: |
          APK=apps/mobile/android/app/build/outputs/apk/release/app-release.apk
          $ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner verify --print-certs "$APK" | head -4

      - name: 收集产物
        run: |
          mkdir -p out
          cp apps/mobile/android/app/build/outputs/apk/release/app-release.apk \
             "out/CHAGS-${{ needs.version.outputs.version }}-android.apk"
          ls -lh out

      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: out/*.apk
          retention-days: 7

  # ---------- 发 Release ----------
  release:
    needs: [version, windows, android]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: 整理发布文件
        run: |
          mkdir -p files
          cp artifacts/windows-exe/*.exe files/
          cp artifacts/android-apk/*.apk files/
          ls -lh files

      - uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          files: files/*
          generate_release_notes: true
          draft: false
          # 注意：不要在这里传 prerelease —— with 的输入全是字符串，
          # "false" 在 JS 里是 truthy，会把正式版本也标成预发布。
          # 预发布标记由下一步显式纠正。
          body: |
            ## 下载

            | 平台 | 文件 | 说明 |
            |---|---|---|
            | Windows | CHAGS-${{ needs.version.outputs.version }}-windows-x64-portable.exe | 便携版，**双击即玩，无需安装**（首次运行可能有 SmartScreen 提示，选「更多信息 → 仍要运行」） |
            | Android | CHAGS-${{ needs.version.outputs.version }}-android.apk | 直接安装（需在设置里允许「安装未知来源的应用」） |

            版本 ${{ needs.version.outputs.version }} ｜ 内置中英文，可在应用内一键切换。

      - name: 确认发布类型
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 带 - 的 tag（v1.0.0-beta.1）保持预发布；其余显式改回正式发布。
          # 不这么做的话，上面的 action 会因为"字符串 false 是 truthy"而一律标成预发布。
          if [[ "${GITHUB_REF_NAME}" == *-* ]]; then
            echo "${GITHUB_REF_NAME} 带 - ，保持预发布"
          else
            gh release edit "${GITHUB_REF_NAME}" --prerelease=false
            echo "${GITHUB_REF_NAME} 已确认为正式发布"
          fi
